<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Collection — Little Traits | Kidswear Pakistan</title>
  <meta name="description" content="Browse the Little Traits kidswear collection in Pakistan. Filter by Boys, Girls, Unisex, Baby & Toddler, Co-ord Sets, and child sizes from 6 months to 10 years." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2.0" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Shared Header Mount -->
  <div id="site-header-mount"></div>

  <main id="main-content">
    <!-- Category header: title + department pills (the single department control) -->
    <section class="shop-header" aria-labelledby="shop-page-title">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span aria-hidden="true">/</span>
          <span id="breadcrumb-current" aria-current="page">All Pieces</span>
        </nav>

        <div class="shop-header__intro">
          <div>
            <span class="eyebrow" id="shop-eyebrow">Sizes 6M – 10Y</span>
            <h1 class="heading-lg" id="shop-page-title">All Pieces</h1>
          </div>
          <p class="shop-header__desc" id="shop-page-desc">
            Shirts, dresses, sets and cosy layers for ages 6 months to 10 years.
          </p>
        </div>

        <div class="chip-scroller chip-scroller--tabs" id="shop-category-tabs" role="group" aria-label="Department">
          <!-- Populated dynamically -->
        </div>
      </div>
    </section>

    <section class="shop-workspace" aria-label="Product catalogue">
      <div class="container">
        <!-- Toolbar: size filter + sort -->
        <div class="shop-toolbar">
          <div class="shop-toolbar__sizes">
            <span class="shop-toolbar__label" id="size-filter-label">Size</span>
            <div class="chip-scroller" id="shop-size-chips" role="group" aria-labelledby="size-filter-label">
              <!-- Populated dynamically -->
            </div>
          </div>
          <div class="shop-toolbar__end">
            <span class="shop-results-count" id="shop-results-count" aria-live="polite">6 pieces</span>
            <div class="sort-select-wrap">
              <label for="shop-sort-select">Sort</label>
              <select id="shop-sort-select" class="sort-select">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A–Z</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Applied filter overview -->
        <div class="active-filters-bar" id="active-filters-bar" hidden></div>

        <div class="product-grid" id="shop-product-grid"></div>
        <div id="shop-empty-state" hidden></div>
      </div>
    </section>
  </main>

  <!-- Shared Footer Mount -->
  <div id="site-footer-mount"></div>

  <script src="js/data.js?v=2.0"></script>
  <script src="js/app.js?v=2.0"></script>
  <script src="js/shop.js?v=2.0"></script>
</body>
</html>
